# Cloudflare Workers AI (gratuito, sem API key externa)
[ai]
binding = "AI"

# Keepalive contra a pausa por inatividade do Supabase (7 dias sem uso).
# Duas vezes por dia: o projeto já pausou uma vez com o cron de 3 em 3 dias, porque
# duas execuções perdidas bastavam para fechar a janela. Cron do Worker é gratuito.
[triggers]
crons = ["0 8 * * *", "0 20 * * *"]

